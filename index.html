<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Riempifrigo</title>
<meta name="description" content="Lista della spesa con checklist, suggerimenti e report">
<meta name="theme-color" content="#F1F4EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111613" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column phone app, three views (Lista / Spesa / Report) switched by a fixed bottom tab bar */
:root{
  --bg:#F1F4EE; --surface:#FFFFFF; --ink:#18221C; --muted:#5D6A61; --line:#DAE1D6;
  --accent:#2E6A3E; --accent-ink:#FFFFFF; --accent-soft:#E1ECE2;
  --due:#9A6410; --due-soft:#FAEFD6; --late:#A8352A; --late-soft:#F8E0DC;
  --paper:#FBFCF9;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px; --nav-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111613; --surface:#19201B; --ink:#E6ECE5; --muted:#98A49B; --line:#2A342D;
    --accent:#83C493; --accent-ink:#0E1911; --accent-soft:#1F3226;
    --due:#E6B65E; --due-soft:#352B17; --late:#F0897D; --late-soft:#3B211E;
    --paper:#1C231E; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:8px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 14px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.75rem;letter-spacing:-.02em;line-height:1}
.brand span{color:var(--accent)}
.gear{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.gear svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

h2{font-family:var(--f-display);font-weight:600;font-size:1.15rem;letter-spacing:-.01em;margin:0;text-wrap:balance}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.view{display:flex;flex-direction:column;gap:18px}

.add{position:relative;display:flex;gap:8px}
.add input{flex:1;min-width:0;height:54px;padding:0 16px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:1.05rem}
.add input:focus{border-color:var(--accent);outline:none}
.addBtn{flex:none;width:54px;height:54px;border:0;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font-size:1.7rem;line-height:1;font-weight:500}
.ac{position:absolute;left:0;right:62px;top:60px;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgb(0 0 0 / .14);overflow:hidden}
.ac button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border:0;background:none;text-align:left;border-top:1px solid var(--line)}
.ac button:first-child{border-top:0}
.ac button:hover,.ac button.sel{background:var(--accent-soft)}
.ac .meta{font-size:.78rem;color:var(--muted);font-family:var(--f-mono);white-space:nowrap}
.ac .in{color:var(--accent)}

.recipeBtn{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:12px;border:1.5px dashed var(--line);background:none;color:var(--accent);font-weight:600;font-size:.95rem}
.recipeBtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.92rem}
.chip b{font-weight:600}
.chip .plus{color:var(--accent);font-weight:700}
.chip.due{border-color:transparent;background:var(--due-soft)}
.chip.late{border-color:transparent;background:var(--late-soft)}
.chip small{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.sugHead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}

.group{display:flex;flex-direction:column}
.groupHead{display:flex;justify-content:space-between;padding:0 4px 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.rowMain{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:13px 14px;border:0;background:none;text-align:left}
.nmw{flex:1;min-width:0}
.nm{flex:1;min-width:0;overflow-wrap:anywhere}
.from{display:block;font-size:.74rem;color:var(--muted);margin-top:1px}
.qty{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);background:var(--bg);padding:2px 8px;border-radius:6px;white-space:nowrap}
.x{flex:none;width:48px;border:0;background:none;color:var(--muted);font-size:1.3rem}
.row.done .nm{text-decoration:line-through;color:var(--muted)}
.tag{font-size:.72rem;color:var(--accent);font-weight:600}
.lists{display:flex;flex-direction:column;gap:16px}
.listHead{display:flex;justify-content:space-between;align-items:baseline}

.empty{padding:22px 18px;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:1.05rem;margin-bottom:4px}

.shopHead{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding-block:4px 10px;display:flex;flex-direction:column;gap:10px}
.prog{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.prog .big{font-family:var(--f-display);font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums}
.prog .big small{font-size:1rem;color:var(--muted);font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease}
.finish{height:50px;border:0;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:1rem}
.finish:disabled{background:var(--line);color:var(--muted);cursor:default}
.check{flex:1;display:flex;align-items:center;gap:14px;padding:15px 14px;border:0;background:none;text-align:left;min-width:0;font-size:1.06rem}
.box{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center}
.check[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.box svg{width:16px;height:16px;stroke:var(--accent-ink);fill:none;stroke-width:3;opacity:0}
.check[aria-pressed="true"] .box svg{opacity:1}
.check[aria-pressed="true"] .nm{text-decoration:line-through;color:var(--muted)}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.tile .v{font-family:var(--f-display);font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .l{font-size:.78rem;color:var(--muted);margin-top:4px;line-height:1.3}
.chartCard{padding:14px 12px 8px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:9px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .b{fill:var(--accent)}
.chart .b.now{opacity:.55}
.rec{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;border-top:1px solid var(--line)}
.rec:first-child{border-top:0}
.rec .info{flex:1;min-width:0}
.rec .n{font-weight:600;overflow-wrap:anywhere}
.rec .d{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{flex:none;font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.due{background:var(--due-soft);color:var(--due)}
.pill.late{background:var(--late-soft);color:var(--late)}
.pill.inlist{background:var(--bg);color:var(--muted)}
.mini{flex:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-size:1.2rem;font-weight:700}
details.once summary{cursor:pointer;color:var(--muted);font-size:.9rem;padding:4px}
details.once p{margin:6px 4px 0;font-size:.9rem;color:var(--muted)}

.receipts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.receipt{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:12px 14px 18px;font-family:var(--f-mono);font-size:.8rem;line-height:1.5;
  -webkit-mask: radial-gradient(circle at 6px 100%, transparent 5px, #000 5.5px) 0 0/12px 100% repeat-x;
          mask: radial-gradient(circle at 6px 100%, transparent 5px, #000 5.5px) 0 0/12px 100% repeat-x}
.receipt .rh{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--muted);padding-bottom:6px;margin-bottom:6px;font-weight:500}
.receipt ul{list-style:none;margin:0;padding:0}
.receipt li{display:flex;justify-content:space-between;gap:8px}
.receipt li span:first-child{overflow-wrap:anywhere}
.receipt .tot{border-top:1px dashed var(--muted);margin-top:6px;padding-top:6px;display:flex;justify-content:space-between}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--nav-h)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:.78rem;font-weight:600;position:relative}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent)}
.tab[aria-selected="true"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:.68rem;display:grid;place-items:center;font-family:var(--f-mono)}

.sheetBack{position:fixed;inset:0;z-index:40;background:rgb(0 0 0 / .38)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.sheet .inner{max-width:528px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.8rem;color:var(--muted);font-weight:600}
.field input,.field select{height:48px;padding:0 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);font-size:1rem;min-width:0;width:100%}
.field textarea{min-height:160px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);font-size:1rem;resize:vertical;width:100%}
.field input[type=file]{height:auto;padding:10px 12px;font-size:.9rem}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--late)}
.btn.small{flex:none;min-width:0;height:36px;padding:0 12px;font-size:.88rem}
.btn:disabled{opacity:.55;cursor:default}
.note{font-size:.88rem;color:var(--muted);margin:0}
.status{font-size:.92rem;color:var(--muted);margin:0}
.status.err{color:var(--late)}
.labelRow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pick{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.pick:first-child{border-top:0}
.pick input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.pick label{flex:1;min-width:0;display:flex;flex-direction:column}
.pick .h{font-size:.76rem;color:var(--muted)}
.pick.off label{color:var(--muted)}
.section{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.section + .section{border-top:1px solid var(--line);padding-top:14px}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.92rem;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgb(0 0 0 / .2)}
.flash{animation:fl 1s ease}
@keyframes fl{0%,40%{background:var(--due-soft)}100%{background:transparent}}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}.flash{animation:none}}
@media (max-width:360px){.tiles{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Riempifrigo<span>.</span></div>
    <button class="gear" data-act="settings" aria-label="Dati e backup">
      <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main>
    <section id="view-lista" class="view" aria-labelledby="tab-lista">
      <form id="addForm" class="add" autocomplete="off">
        <label for="addInput" class="sr">Aggiungi un prodotto</label>
        <input id="addInput" type="text" placeholder="Cosa ti serve? es. 2 latte" enterkeyhint="done" autocapitalize="sentences">
        <button type="submit" class="addBtn" aria-label="Aggiungi alla lista">+</button>
        <div id="ac" class="ac" hidden role="listbox" aria-label="Suggerimenti"></div>
      </form>
      <button class="recipeBtn" data-act="recipe">
        <svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M9 10h6M9 14h6M9 18h3"/></svg>
        Aggiungi da una ricetta
      </button>
      <div id="suggest"></div>
      <div id="listWrap"></div>
    </section>

    <section id="view-spesa" class="view" hidden aria-labelledby="tab-spesa">
      <div id="shopWrap"></div>
    </section>

    <section id="view-report" class="view" hidden aria-labelledby="tab-report">
      <div id="reportWrap"></div>
    </section>
  </main>
</div>

<nav class="tabs" aria-label="Sezioni">
  <div class="in" role="tablist">
    <button class="tab" id="tab-lista" role="tab" aria-selected="true" data-tab="lista">
      <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>
      Lista<span id="badge" class="badge" hidden></span>
    </button>
    <button class="tab" id="tab-spesa" role="tab" aria-selected="false" data-tab="spesa">
      <svg viewBox="0 0 24 24"><path d="M3 4h2.5l2.2 11h10.6l2-8H6.3"/><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>
      Spesa
    </button>
    <button class="tab" id="tab-report" role="tab" aria-selected="false" data-tab="report">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      Report
    </button>
  </div>
</nav>

<div id="sheetBack" class="sheetBack" hidden></div>
<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true"><div id="sheetBody" class="inner"></div></div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
/* PARSER START */
/* Shared helpers + offline recipe reader (no network, no AI). */
var norm = function(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim(); };
var cap = function(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; };

var RECIPE = (function(){
  var UNIT = "(?:kg|g|gr|grammi|hg|mg|l|lt|litri|litro|ml|cl|dl|cucchiai(?:ni|no)?|cucchiaio|cucchiaino|cucchiaini|tazz(?:a|e|ina|ine)|bicchier(?:e|i)|spicch(?:i|io)|fett(?:a|e|ine)|foglie|foglia|rametti|rametto|ciuff(?:o|i)|mazz(?:o|etto|etti)|pizzic(?:o|hi)|bustin(?:a|e)|bust(?:a|e)|confezion(?:e|i)|vasett(?:o|i)|scatol(?:a|e|etta)|lattin(?:a|e)|panetto|panetti|pacco|pacchi|cubetto|cubetti|noce|noci|pz|pezzi|pezzo|cost(?:a|e)|cespo|test(?:a|e)|gamb(?:o|i)|rotol(?:o|i)|barattol(?:o|i)|bottigli(?:a|e)|filett(?:o|i)|tranc(?:io|i))";
  var NUM = "(?:\\d+(?:[.,]\\d+)?(?:\\s*\\/\\s*\\d+)?(?:\\s*[-–]\\s*\\d+(?:[.,]\\d+)?)?|½|¼|¾|⅓|⅔)";
  var QB = "(?:q\\.?\\s?b\\.?|quanto basta|a piacere|qb)";
  var reTrail = new RegExp("^(.*?)[\\s:,–-]+((?:circa\\s*)?" + NUM + "\\s*" + UNIT + "?\\.?|" + QB + ")$", "i");
  var reLead  = new RegExp("^((?:circa\\s*)?(?:" + NUM + "|un|una|uno|un'|mezz[oa])\\s*(?:" + UNIT + "\\.?)?)\\s*(?:di\\s+|d'|d’)?(.+)$", "i");
  var reOnlyQty = new RegExp("^(?:circa\\s*)?(" + NUM + "\\s*" + UNIT + "?\\.?|" + QB + ")$", "i");
  var START = /^(ingredienti|ingredients|occorrente|cosa serve|lista (?:della )?spesa)\b/i;
  var END = /^(preparazione|procedimento|come (?:si )?prepar|istruzioni|passaggi|metodo|esecuzione|consigli|conservazione|note|step\s*1|1\.\s+[a-z])/i;
  var JUNK = /\b(calorie|kcal|energia|carboidrati|zuccheri|proteine|grassi|saturi|fibre|colesterolo|sodio|difficolta|cottura|costo|tempo|preparazione:|dati forniti|valori nutrizionali|iscriviti|commenti|pubblicit)/;
  var PANTRY = /^(sale|pepe|olio|acqua|aceto|origano|noce moscata|cannella|paprika|curry|cumino|curcuma|alloro|bicarbonato|zucchero a velo)\b/;
  var FRAC = {"½":"0.5","¼":"0.25","¾":"0.75","⅓":"0.33","⅔":"0.67"};

  function cleanLine(l){
    return l.replace(/ /g," ").replace(/^[\s\-–—*•·●▪◦>+]+/, "").replace(/^\d+[.)]\s+(?=[A-Za-zÀ-ÿ])/, "").replace(/\s+/g," ").trim();
  }
  function qtyNorm(q){
    q = String(q||"").trim().replace(/\.$/,"");
    if (new RegExp("^" + QB + "$","i").test(q)) return "";
    q = q.replace(/^circa\s*/i,"");
    q = q.replace(/[½¼¾⅓⅔]/g, function(c){ return FRAC[c]; });
    q = q.replace(/^(un|una|uno|un')\b\s*/i, "1 ").replace(/^mezz[oa]\b\s*/i, "0.5 ");
    q = q.replace(/(\d)\s*(kg|g|gr|hg|mg|l|lt|ml|cl|dl)\b/i, function(m,a,b){ var u=b.toLowerCase(); if(u==="gr")u="g"; if(u==="lt")u="l"; return a + (u==="l"?" l":u); });
    q = q.replace(/\s*grammi\b/i, "g");
    return q.replace(/(\d)\.(\d)/g, "$1,$2").replace(/\s+/g," ").trim();
  }
  function cleanName(n){
    n = String(n||"");
    n = n.replace(/\([^)]*\)/g," ").replace(/\[[^\]]*\]/g," ");

    n = n.split(/,(?!\d)/)[0];
    n = n.replace(/^(di|d'|d’)\s*/i,"").replace(/[:;.\s]+$/,"").replace(/\s+/g," ").trim();
    return cap(n);
  }
  function circaN(raw){ var m = String(raw).match(/\(\s*(?:circa|ca\.?)?\s*(\d+)[^)]*\)/i); return m ? m[1] : ""; }
  function isEgg(n){ return /^(album[ie]|tuorl[oi]|uov[ao]|uova)\b/.test(norm(n)); }
  function eggCount(n, qty, raw){
    var c = circaN(raw); if (c) return +c;
    var m = String(qty).match(/^(\d+(?:\.\d+)?)\s*(g)?$/);
    if (!m) return 0;
    var v = parseFloat(m[1]);
    if (!m[2]) return Math.ceil(v);
    var k = norm(n);
    var per = /^album/.test(k) ? 33 : /^tuorl/.test(k) ? 18 : 55;
    return Math.max(1, Math.round(v / per));
  }
  function parseQtyNum(q){
    var m = String(q).match(/^(\d+(?:[.,]\d+)?)(?:\s*\/\s*(\d+))?\s*(.*)$/);
    if (!m) return null;
    var v = parseFloat(m[1].replace(",","."));

  function fmtNum(v){ var r = Math.round(v * 10) / 10; return String(r).replace(".", ","); }
  function fmtQty(v, unit){
    if (!unit) return String(Math.ceil(v - 0.05));
    if (/^(g|ml|mg)$/i.test(unit)){ var r = v >= 100 ? Math.round(v / 5) * 5 : Math.round(v); return r + unit; }
    if (/^(kg|l|cl|dl)$/i.test(unit)) return fmtNum(v) + (unit === "l" ? " l" : unit);
    return fmtNum(v) + " " + unit;
  }
  function scaleQty(q, f){
    if (!q || !f || f === 1) return q;
    var p = parseQtyNum(String(q).replace(/^(\d+)\s*[-–]\s*\d+/, "$1"));
    if (!p) return q;
    var unit = p.unit.replace(/^l$/,"l");
    return fmtQty(p.v * f, unit);
  }
  function merge(list){
    var map = {}, out = [];
    list.forEach(function(it){
      var k = norm(it.name);
      if (!map[k]){ map[k] = it; out.push(it); return; }
      var a = map[k];
      if (isEgg(a.name)){ a.qty = String(Math.max(+a.qty || 0, +it.qty || 0) || ""); return; }
      if (!it.qty) return;
      if (!a.qty){ a.qty = it.qty; return; }
      var pa = parseQtyNum(a.qty), pb = parseQtyNum(it.qty);
      if (pa && pb && pa.unit === pb.unit) a.qty = fmtQty(pa.v + pb.v, pa.unit);
      else if (a.qty !== it.qty) a.qty = a.qty + " + " + it.qty;
    });

  }
  function cleanTitle(t){
    t = String(t||"").replace(/\s+/g," ").trim();
    if (!t || /^https?:\/\//i.test(t)) return "";

    t = t.replace(/^ricetta\s+(?:di\s+|del\s+|della\s+)?/i,"").replace(/\s+ricetta$/i,"");

  function parse(text, sharedTitle){
    var raw = String(text||"").replace(/\r/g,"").split(/\n|;|•|•/);
    var lines = raw.map(cleanLine).filter(Boolean);
    var startIdx = -1;
    for (var i = 0; i < lines.length; i++){ if (START.test(norm(lines[i]))){ startIdx = i; break; } }
    var servings = 0;
    var full = lines.join("\n");
    var sm = full.match(/(?:dosi\s+per|per|porzioni|persone)\s*:?\s*(\d{1,2})\s*(persone|porzioni|pezzi|pancake|people|servings)?/i);
    if (sm && (sm[2] || /dosi|porzioni|persone/i.test(sm[0]))) servings = +sm[1];
    var title = cleanTitle(sharedTitle);
    for (var b = startIdx - 1; !title && b >= 0 && b >= startIdx - 4; b--){
      var cand = lines[b], nc = norm(cand);
      if (/^(dosi|porzioni|persone|difficolta|preparazione|cottura|costo|tempo)\b/.test(nc) || JUNK.test(nc)) continue;
      if (cand.split(" ").length <= 6 && !reTrail.test(cand) && !reOnlyQty.test(cand)) title = cleanTitle(cand);
      break;
    }
    var body = startIdx >= 0 ? lines.slice(startIdx + 1) : lines;
    var strict = startIdx < 0;
    var items = [];
    for (var j = 0; j < body.length; j++){
      var l = body[j], nl = norm(l);
      if (END.test(nl)) break;
      if (JUNK.test(nl)) continue;
      if (/^https?:\/\//i.test(l)) continue;
      if (/:$/.test(l) && !/\d/.test(l)) continue;           // sub-header "Per la crema:"
      if (/^per\s+(il|la|lo|l'|i|gli|le)\s/i.test(l) && l.split(" ").length <= 5 && !reTrail.test(l)) continue;
      var only = l.match(reOnlyQty);
      if (only){
        var prev = items[items.length - 1];
        if (prev && !prev.qty && !prev.qtyDone){ prev.qty = qtyNorm(only[1]); prev.qtyDone = true; if (isEgg(prev.name)) prev.qty = String(eggCount(prev.name, prev.qty, prev.raw) || ""); }
        continue;
      }
      if (l.length > 70 || l.split(" ").length > 9) continue;
      if (/[.!?]\s+[A-ZÀ-Ý]/.test(l)) continue;
      var name = "", qty = "", qtyDone = false, m;
      if ((m = l.match(reTrail)) && m[1].trim() && !/^0+$/.test(m[2].trim()) && !/\b(tipo|n\.?)$/i.test(m[1].trim())){ name = m[1]; qty = qtyNorm(m[2]); qtyDone = true; }
      else if ((m = l.match(reLead)) && m[2] && /[a-zà-ÿ]/i.test(m[2]) && !/^\d/.test(m[2])){ name = m[2]; qty = qtyNorm(m[1]); qtyDone = true; }
      else {
        if (strict) continue;
        name = l;
      }
      var nm = cleanName(name);
      if (!nm || nm.length < 2 || /^\d/.test(nm)) continue;
      var it = { name: nm, qty: qty, raw: l, qtyDone: qtyDone };
      if (isEgg(nm)){ it.qty = String(eggCount(nm, qty, l) || ""); it.name = "Uova"; }
      items.push(it);
    }
    items = merge(items).map(function(it){ return { name: it.name, qty: it.qty, pantry: PANTRY.test(norm(it.name)) }; });
    return { title: title, servings: servings, items: items };
  }
  return { parse: parse, scaleQty: scaleQty, cleanTitle: cleanTitle };
})();

function tile(v,l){ return '<div class="tile"><div class="v">'+esc(v)+'</div><div class="l">'+esc(l)+'</div></div>'; }
function weekStart(ms){ const d = new Date(ms); d.setHours(0,0,0,0); const wd = (d.getDay()+6)%7; d.setDate(d.getDate()-wd); return d.getTime(); }
function weeklyChart(trips){
  const W = 320, H = 132, L = 22, R = 6, T = 10, B = 22;
  const cur = weekStart(Date.now());
  const weeks = [];
  for (let i = 11; i >= 0; i--){ const d = new Date(cur); d.setDate(d.getDate() - i*7); weeks.push({ start: d.getTime(), n: 0 }); }
  trips.forEach(t => { const ws = weekStart(new Date(t.at).getTime()); const w = weeks.find(x => x.start === ws); if (w) w.n++; });
  const max = Math.max(1, ...weeks.map(w => w.n));
  const ticks = max <= 4 ? Array.from({length:max+1},(_,i)=>i) : [0, Math.round(max/2), max];
  const ph = H - T - B, pw = W - L - R, bw = pw / 12;
  const y = v => T + ph - v / max * ph;
  let s = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Numero di spese per settimana nelle ultime 12 settimane">';
  ticks.forEach(t => { s += '<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(t)+'" y2="'+y(t)+'"/><text x="'+(L-5)+'" y="'+(y(t)+3)+'" text-anchor="end">'+t+'</text>'; });
  weeks.forEach((w,i) => {
    const x = L + i*bw + bw*0.18, bwi = bw*0.64;
    if (w.n) s += '<rect class="b'+(i===11?' now':'')+'" x="'+x.toFixed(1)+'" y="'+y(w.n).toFixed(1)+'" width="'+bwi.toFixed(1)+'" height="'+(T+ph-y(w.n)).toFixed(1)+'" rx="3"><title>'+w.n+' spese</title></rect>';
    if (i % 3 === 2 || i === 11){
      const d = new Date(w.start);
      s += '<text x="'+(L + i*bw + bw/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+(i===11 ? "questa" : pad(d.getDate())+"/"+pad(d.getMonth()+1))+'</text>';
    }
  });
  return s + '</svg>';
}

/* ---------- Autocomplete ---------- */
let acSel = -1, acItems = [];
function search(q){
  const nq = norm(q);
  if (!nq) return [];
  const inList = inListSet();
  const res = [], seen = new Set();
  const score = n => n.startsWith(nq) ? 3 : n.split(" ").some(w => w.startsWith(nq)) ? 2 : n.includes(nq) ? 1 : 0;
  catalogArr().forEach(p => {
    const n = norm(p.name), s = score(n);
    if (s){ seen.add(n); res.push({ name: p.name, meta: p.st.count + "× · " + (every(p.st.every) || "1 spesa"), rank: s*1000 + Math.min(p.st.count,99)*5, inList: inList.has(n) }); }
  });
  STAPLES.forEach((name,i) => {
    const n = norm(name), s = score(n);
    if (s && !seen.has(n)){ seen.add(n); res.push({ name, meta: "", rank: s*100 - i, inList: inList.has(n) }); }
  });
  return res.sort((a,b) => b.rank - a.rank).slice(0,6);
}

  acItems = search(parseEntry(q).name);

  box.hidden = false;
}

function mergeImport(o){
  const items = Object.assign({}, S.data.items), cat = Object.assign({}, S.data.catalog), trips = Object.assign({}, S.data.trips);
  let nI = 0, nC = 0, nT = 0;
  const names = new Set(Object.values(items).map(i => norm(i.name)));
  Object.entries(o.items || {}).forEach(([id,v]) => { if (v && v.name && !items[id] && !names.has(norm(v.name))){ items[id] = { name: String(v.name), qty: String(v.qty||""), cat: CAT_NAME[v.cat] ? v.cat : guessCat(v.name), checked: !!v.checked, addedAt: v.addedAt || new Date().toISOString(), ...(v.from ? { from: String(v.from) } : {}) }; names.add(norm(v.name)); nI++; } });
  Object.entries(o.catalog || {}).forEach(([id,v]) => {
    if (!v || !v.name) return;
    const key = slug(v.name), old = cat[key];
    const dates = [...new Set([...(old && old.dates || []), ...(Array.isArray(v.dates) ? v.dates : [])])].sort().slice(-80);
    cat[key] = { name: old ? old.name : String(v.name), cat: (old && old.cat) || (CAT_NAME[v.cat] ? v.cat : guessCat(v.name)), dates, lastQty: (old && old.lastQty) || String(v.lastQty||"") };
    if (!old) nC++;
  });
  const seenAt = new Set(Object.values(trips).map(t => t.at));
  Object.entries(o.trips || {}).forEach(([id,v]) => { if (v && v.at && !trips[id] && !seenAt.has(v.at)){ trips[id] = { at: v.at, items: Array.isArray(v.items) ? v.items : [], count: v.count || (v.items||[]).length }; nT++; } });
  S.data.items = items; S.data.catalog = cat; S.data.trips = trips;
  lsSet("items", items); lsSet("catalog", cat); lsSet("trips", trips);
  renderAll();
  return [nI, nC, nT];
}

  if (!txt){ st.textContent = "Scegli un file di backup o incolla i dati."; st.classList.add("err"); return; }
  let o;
  try { o = JSON.parse(txt.slice(txt.indexOf("{"), txt.lastIndexOf("}") + 1)); } catch(e){ o = null; }
  if (!o || !["sporta","riempifrigo"].includes(o.app)){ st.textContent = "Questi non sembrano dati di Riempifrigo. Controlla di aver incollato tutto il testo, dalla prima { all'ultima }."; st.classList.add("err"); return; }
  const [a,b,c] = mergeImport(o);
  closeSheet();
  toast("Importati: " + a + " in lista, " + b + " prodotti, " + c + " spese");
}

/* ---------- Tabs & wake lock ---------- */
let wake = null;
async function wakeOn(){ try { if (navigator.wakeLock && !wake){ wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; }); } } catch(e){ wake = null; } }
function wakeOff(){ try { if (wake) wake.release(); } catch(e){} wake = null; }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && tab === "spesa") wakeOn(); });
function setTab(t){
  if (!VALID.includes(t)) t = "lista";
  tab = t;
  VALID.forEach(v => { $("#view-"+v).hidden = v !== t; $("#tab-"+v).setAttribute("aria-selected", v === t ? "true" : "false"); });
  if (t === "spesa") wakeOn(); else wakeOff();
  window.scrollTo(0,0);
}

/* ---------- Events ---------- */
$("#addForm").addEventListener("submit", e => {
  e.preventDefault();
  const inp = $("#addInput");
  if (acSel >= 0 && acItems[acSel]) addItem(acItems[acSel].name, parseEntry(inp.value).qty);
  else { const p = parseEntry(inp.value); if (p.name) addItem(p.name, p.qty); }
  inp.value = ""; acSel = -1; renderAc(); inp.focus();
});
$("#addInput").addEventListener("input", () => { acSel = -1; renderAc(); });
$("#addInput").addEventListener("keydown", e => {
  if ($("#ac").hidden) return;
  if (e.key === "ArrowDown"){ e.preventDefault(); acSel = Math.min(acItems.length-1, acSel+1); renderAc(); }
  else if (e.key === "ArrowUp"){ e.preventDefault(); acSel = Math.max(-1, acSel-1); renderAc(); }
  else if (e.key === "Escape"){ $("#ac").hidden = true; acSel = -1; }
});
$("#addInput").addEventListener("blur", () => setTimeout(() => { if (!$("#ac").contains(document.activeElement)) $("#ac").hidden = true; }, 150));
$("#addInput").addEventListener("focus", renderAc);
$("#ac").addEventListener("mousedown", e => e.preventDefault());
$("#ac").addEventListener("click", e => {
  const b = e.target.closest("[data-ac]"); if (!b) return;
  const r = acItems[+b.dataset.ac], inp = $("#addInput");
  if (r) addItem(r.name, parseEntry(inp.value).qty);
  inp.value = ""; acSel = -1; renderAc(); inp.focus();
});
document.addEventListener("click", e => {
  const tb = e.target.closest("[data-tab]");
  if (tb){ setTab(tb.dataset.tab); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const id = b.dataset.id, act = b.dataset.act;
  switch (act){
    case "quick": addItem(b.dataset.name); if (tab === "report") toast(b.dataset.name + " aggiunto alla lista"); break;
    case "remove": { const it = S.data.items[id]; del("items", id); if (it) toast(it.name + " tolto dalla lista"); break; }
    case "edit": editSheet(id); break;
    case "toggle": toggleItem(id); break;
    case "finish": finishSheet(); break;
    case "sheet-close": closeSheet(); break;
    case "sheet-finish": finishShopping(); break;
    case "sheet-del": del("items", id); closeSheet(); break;
    case "sheet-save": {
      const it = S.data.items[id]; if (!it){ closeSheet(); break; }
      const name = cap($("#editName").value.trim()) || it.name;
      const cat = $("#editCat").value, qty = $("#editQty").value.trim();
      put("items", id, Object.assign({}, it, { name, qty, cat }));
      const k = slug(name), known = S.data.catalog[k];
      if (known && known.cat !== cat) put("catalog", k, Object.assign({}, known, { cat }));
      closeSheet(); break;
    }
    case "recipe": recipeSheet(); break;
    case "recipe-paste": recipePaste(); break;
    case "recipe-go": recipeGo(); break;
    case "recipe-back": recipeSheet(picks.map(p => p.name + (p.qty ? " " + p.qty : "")).join("\n"), ($("#pickTitle")||{}).value); break;
    case "recipe-add": recipeAdd(); break;
    case "settings": settingsSheet(); break;
    case "bk-save": bkSave(); break;
    case "bk-copy": bkCopy(); break;
    case "bk-paste": bkPaste(); break;
    case "bk-import": bkImport(); break;
  }
});
document.addEventListener("change", e => {
  if (e.target.matches && e.target.matches("[data-pick]")){ e.target.closest(".pick").classList.toggle("off", !e.target.checked); updatePickCount(); }
});
document.addEventListener("input", e => { if (e.target.id === "servFrom" || e.target.id === "servTo") updateScaled(); });
$("#sheetBack").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });

/* ---------- Start ---------- */
loadAll();
renderAll();
const hash = (location.hash || "").slice(1);
setTab(hash);
const qs = new URLSearchParams(location.search);
const shTitle = qs.get("title") || "", shText = qs.get("text") || "", shUrl = qs.get("url") || "";
if (shTitle || shText || shUrl){
  history.replaceState(null, "", location.pathname);
  setTab("lista");
  let body = shText;
  if (shUrl && !body.includes(shUrl)) body = (body ? body + "\n" : "") + shUrl;
  recipeSheet(body.trim(), RECIPE.cleanTitle(shTitle));
  if (/^https?:\/\/\S+$/.test(body.trim())){
    const st = $("#recipeStatus");
    st.textContent = "Hai condiviso solo il link: Riempifrigo non può aprire le pagine. Torna alla ricetta, seleziona l'elenco degli ingredienti e condividi il testo (o copialo e premi Incolla).";
    st.classList.add("err");
  }
} else if (hash === "ricetta"){
  history.replaceState(null, "", location.pathname);
  recipeSheet();
}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
if ("serviceWorker" in navigator) window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
})();
</script>
